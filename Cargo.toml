[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# --- internal crates ---
sisf-render = { path = "crates/sisf-render" }
sisf-sprite = { path = "crates/sisf-sprite" }
sisf-text = { path = "crates/sisf-text" }
sisf-event = { path = "crates/sisf-event" }
sisf-asset = { path = "crates/sisf-asset" }
sisf-media = { path = "crates/sisf-media" }
sisf-audio = { path = "crates/sisf-audio" }
sisf-app = { path = "crates/sisf-app", default-features = false }
sisf-rpgmk = { path = "crates/sisf-rpgmk" }
# 注：不再声明 `sisf = { path = "crates/sisf" }` —— 门面 crate 没有任何 workspace 成员依赖它
# （示例是它自己的 `[[example]]`），最新 cargo 会把它判成 `unused workspace dependency`。

# --- pinned third-party (设计文档 §依赖钉版) ---
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.13"
bytemuck = { version = "1.25.2", features = ["derive"] }
rect_packer = "0.2.1"
etagere = "0.3.0"
cosmic-text = "0.19.0"
symphonia = { version = "0.6.1", default-features = false }
lewton = { version = "0.10.2", default-features = false, features = ["ogg"] }
# lofty 必须带默认 feature `id3v2_compression_support`：0.25.4 关掉它会在
# `id3/v2/frame/read.rs` 留下未导入的 `Id3v2Error*`（上游 cfg 断裂），直接编译失败。
lofty = "0.25.4"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rustysynth = "1.3.6"
png = "0.18.1"
jpeg-decoder = "0.3.2"
image-webp = "0.2.4"
gif = "0.14.2"
turbojpeg = "1.5.1"
# T11 归档 provider（`sisf-rpgmk/archive`，只在非 wasm target 可见）。默认集是九条
# （aes-crypto/bzip2/deflate64/deflate/lzma/ppmd/time/zstd/xz），而 MV/MZ 工程归档只用
# deflate；只开 deflate ⇒ 纯 Rust（flate2 + zlib-rs），无 C 工具链。理由登记在
# todo.md「附：钉版增补」的 T11 那条。
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# JS 第二脚本语言运行时（T11 续：`sisf-event/js`）。native = rquickjs（quickjs-ng），
# wasm = 浏览器自带引擎（js-sys，零新 crate）。钉 0.11.0：它是 rust-version=1.85 之上
# 最新的一条（0.12+ 要 1.87，超了 workspace 声明的 MSRV）。
# ⚠️ `rquickjs-sys` 用 `cc` 编 quickjs-ng 的 C —— **这是本仓库第一个 C 依赖**，但它整个
# 门控在可选 `js` feature 后面（不在 default/native/web 里），所以默认构建仍然一行 C 都不编。
# 只开 `std`：closure/`Function` API 够用，不拉 `macro`（proc-macro）/`either`/`indexmap`。
rquickjs = { version = "0.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ron = "0.12.2"
gilrs = "0.11.2"
thiserror = "2"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "VisibilityState",
    "HtmlCanvasElement",
    "Element",
    "EventTarget",
    "Performance",
    "Response",
    "console",
] }
js-sys = "0.3"
android-activity = "0.6"
cpal = "0.18.2"
# T12 `xtask wasm-test`：wasm 侧的测试外壳（只在 dev-dependencies 里，且只在 wasm32 target
# 声明 —— 运行时依赖面一个字节都没多）。配套 runner 是 `.cargo/config.toml` 的
# `wasm-bindgen-test-runner`，版本与上面 `wasm-bindgen` 钉的 0.2.128 同步。
wasm-bindgen-test = "0.3.78"

[profile.release]
opt-level = 3
lto = "thin"
