[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# --- internal crates ---
sisf-render = { path = "crates/sisf-render" }
sisf-sprite = { path = "crates/sisf-sprite" }
sisf-text = { path = "crates/sisf-text" }
sisf-event = { path = "crates/sisf-event" }
sisf-asset = { path = "crates/sisf-asset" }
sisf-media = { path = "crates/sisf-media" }
sisf-audio = { path = "crates/sisf-audio" }
sisf-app = { path = "crates/sisf-app", default-features = false }
sisf-rpgmk = { path = "crates/sisf-rpgmk" }
sisf = { path = "crates/sisf" }

# --- pinned third-party (设计文档 §依赖钉版) ---
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.13"
bytemuck = { version = "1.25.2", features = ["derive"] }
rect_packer = "0.2.1"
etagere = "0.3.0"
cosmic-text = "0.19.0"
png = "0.18.1"
jpeg-decoder = "0.3.2"
image-webp = "0.2.4"
gif = "0.14.2"
turbojpeg = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
thiserror = "2"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "VisibilityState",
    "HtmlCanvasElement",
    "Element",
    "EventTarget",
    "Performance",
    "Response",
    "console",
] }
js-sys = "0.3"
android-activity = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
