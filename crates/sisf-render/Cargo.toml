[package]
name = "sisf-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "批量 quad 渲染器：wgpu 唯一消费者（图集/管线/Bitmap-RT/clip 栈）"

[dependencies]
sisf-asset.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
rect_packer.workspace = true

[features]
default = ["image"]
# 图集 + 图像上传（T4）。关掉只剩纯色 quad 通路。
image = ["sisf-asset/image"]
debug_lines = []

[dev-dependencies]
pollster.workspace = true

# T12：`cargo xtask wasm-test` 的外壳。只在 wasm32 的 dev-dependencies 里，
# 另两端的依赖面一个字节都没变（`cargo tree -e features` 可复核）。
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
