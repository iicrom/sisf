[package]
name = "sisf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SISF：基于 wgpu 的跨平台 2D 引擎门面 crate"

[dependencies]
sisf-app = { workspace = true }
sisf-render.workspace = true
sisf-sprite.workspace = true
sisf-text.workspace = true
sisf-event.workspace = true
sisf-asset.workspace = true
sisf-audio.workspace = true
sisf-media = { workspace = true, optional = true }
sisf-rpgmk = { workspace = true, optional = true }

[features]
default = ["native"]
# 启用：sisf-app/native（winit 桌面+Android 窗口；T9 gilrs 挂这里）+ 图像解码 + cpal 输出
native = ["sisf-app/native", "sisf-audio/native", "image"]
# 启用：sisf-app/web（wasm-bindgen + WebAudio pump(T7) + fetch VFS(T4)）+ 图像解码
web = ["sisf-app/web", "sisf-asset/web", "sisf-audio/web", "image"]
# 启用：图像解码链（sisf-media/{png,jpeg-decoder,image-webp} + 手写 BMP）与图集/上传（T4）
image = ["dep:sisf-media", "sisf-media/image", "sisf-asset/image", "sisf-render/image"]
# 启用：sisf-media/gif → gif crate，多帧→AnimDef（T4）
gif = ["dep:sisf-media", "sisf-media/gif", "sisf-asset/gif"]
# 启用：sisf-media/ogg → symphonia ogg+vorbis（T7）
ogg = ["dep:sisf-media", "sisf-media/ogg", "sisf-audio/ogg"]
# 启用：sisf-media/mp3 → symphonia mp3（T7）
mp3 = ["dep:sisf-media", "sisf-media/mp3", "sisf-audio/mp3"]
# 启用：sisf-media/wav → symphonia wav（T7）
wav = ["dep:sisf-media", "sisf-media/wav", "sisf-audio/wav"]
# 启用：sisf-media/midi → midly + rustysynth（T7）。**必须**透传给 sisf-audio：
# `AudioBus::play_midi` 就门控在它自己的 `midi` 上，只开 sisf-media 会连方法都看不见。
midi = ["dep:sisf-media", "sisf-media/midi", "sisf-audio/midi"]
# 启用：视频（T11 桩：两端都返回 Unsupported，只保留 API 与文档）。
# 为什么带 image：`VideoPlayer` 的纹槽是 `render::Bitmap`，而那个类型整个门控在
# `sisf-render/image` 后面 —— 少了它连签名都写不出来（解码接口本身不需要，见
# `crates/sisf-media/src/video.rs` 的 feature 说明）。
video = ["dep:sisf-media", "sisf-media/video", "image"]
# 没有 `inspector`：T12 定案不引 egui 调试面板（`sisf-app` 那边同步删掉了空 feature）。
# 启用：sisf-rpgmk 兼容层（T11）
rpgmk = ["dep:sisf-rpgmk"]
# 启用：JS 第二脚本语言运行时（T11 续，`sisf-event/js`）。native = rquickjs（会 `cc` 编
# quickjs-ng 的 C），wasm = 浏览器自带引擎。默认**不开**：`rpgmv_shell` 用 `#[cfg(feature="js")]`
# 门控那条腿，关着时 355/356 仍走"后端不认名字"的告警路径（DoD-4：feature 关掉 + 文档标注）。
js = ["sisf-event/js"]
# 启用：sisf-media/simd-jpeg → turbojpeg（native only，T4）
simd-jpeg = ["dep:sisf-media", "sisf-media/simd-jpeg"]

[[example]]
name = "hello_window"
path = "../../examples/hello_window.rs"

[[example]]
name = "sprite_bench"
path = "../../examples/sprite_bench.rs"

[[example]]
name = "windows"
path = "../../examples/windows.rs"

[[example]]
name = "audio_demo"
path = "../../examples/audio_demo.rs"
# 三条解码链齐了才编：示例要把 fixture 一次性解码成驻留样本（见文件头的"解码一次"），
# 少了任何一条那份 fixture 就解不出来。`cargo check --all-targets` 会自动跳过它。
required-features = ["ogg", "mp3", "wav"]

# 三层 tilemap + 键盘 4 向行走 + 网格碰撞（T8e）。`image` 只因为示例用 `Atlas/UploadRing`
# 把程序生成的位图送进 GPU —— 不涉及任何解码，故不需要 ogg/mp3/wav 那类能力。
# `test = true`：验收跑的是**示例自带**的单测（地图形状、三层的 z 序、碰撞表上的 MoveRoute）。
[[example]]
name = "tiled_map"
path = "../../examples/tiled_map.rs"
test = true
required-features = ["image"]

# 事件虚拟机 + 三份 `assets/events/*.ron`（T10）。`image` 是同 `tiled_map` 的精灵/上传链，
# ogg/mp3/wav 则是事件表里那三种音频（BGM/BGS/ME/SE 各用一条链才验得出"四条通道都通"）。
# `test = true`：验收跑的是事件表真的编得过 + 消息窗布局数学。
[[example]]
name = "dialog_demo"
path = "../../examples/dialog_demo.rs"
test = true
required-features = ["image", "ogg", "mp3", "wav"]

# 简易 RPG demo：地图/人物/对话走事件虚拟机（内联 RON），菜单与回合战斗是纯游戏侧状态机。
# 不碰位图与音频 ⇒ 无 required-features；`test = true` 跑地图连通、脚本编译与战斗数学。
[[example]]
name = "rpg_demo"
path = "../../examples/rpg_demo.rs"
test = true

# 横向动作 demo：马里奥 1-1 式地图 + 逐拍整数像素物理（跑/跳/火球/踩敌）。
# `image` 是同 `tiled_map` 的程序生成位图 → 图集上传链；`test = true` 跑地图形状、
# 地标实心、跳升程与头撞选格这些物理判据。
[[example]]
name = "platformer"
path = "../../examples/platformer.rs"
test = true
required-features = ["image"]

# 简易视觉小说 demo：三场景（黑幕换幕）+ 会分叉的剧情图，角色进出场归事件表。
# 背景与角色全是程序生成的色块，不碰位图与音频 ⇒ 无 required-features；
# `test = true` 跑五份内联剧本编译、剧情图连通收口、选项/开关对账与黑幕拍数数学。
[[example]]
name = "vn_demo"
path = "../../examples/vn_demo.rs"
test = true

# T11 的移植可行性证明点：吃一份**散文件 MV 工程**（`data/*.json` + `graphics/` + `audio/`），
# 走完整链 —— 进图、走动、触发事件、播 BGM。feature 面就是这条链的依赖闭包：
# `image`（图块/行走图解码）、`ogg`（bgm/se/me 三条都是 ogg，缺一条就播不出）、
# `rpgmk`（`MapDef`/`Scene_Map`/`translate`）、`video`（`rpgmv.movie` 那条 Custom 要落到
# 视频桩上 —— 桩是 DoD-4 唯一被点名的例外）。`test = true`：判据是"这份工程真的编得过、
# 翻译账单真的只欠 251"，跑的是文件内那 9 条几何/翻译/页选择/遮挡单测。
[[example]]
name = "rpgmv_shell"
path = "../../examples/rpgmv_shell.rs"
test = true
required-features = ["image", "ogg", "video", "rpgmk"]
